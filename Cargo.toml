[package]
name = "xrpgui"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.36.1"
eframe = "0.36.1"
xrpl-rust = { version = "1.3.0", features = ["tokio-rt"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
bip32 = "0.5.3"
bip39 = { version = "2.1.0", features = ["rand"] }
argon2 = "0.6.0"
aes-gcm = "0.11.1"
dirs = "7.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
qrcode = "0.14"
